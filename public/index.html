<!DOCTYPE html>
<html>
<head>
    <title>Thành Đạt</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <div class="app">
        <section class="hero">
            <h3>Thành Đạt chuyển file</h3>
            <p>Ngoan Ngoan gửi file nào.</p>
        </section>

        <section class="room panel">
            <label for="tid">Transfer ID</label>
            <input type="text" id="tid" placeholder="Nhập mã phòng, ví dụ: 12345">
        </section>

        <section class="panels">
            <div class="panel send">
                <h4>Gửi File</h4>
                <p class="hint">Chọn file và bắt đầu upload liên tục.</p>
                <input type="file" id="f">
                <button class="action-send" onclick="send()">Gửi File</button>
                <div class="progress"><div class="bar" id="sendBar"></div></div>
                <div class="stats">
                    <span id="sendSpeed">Tốc độ: 0 KB/s</span>
                    <span id="sendEta">Còn lại: --:--</span>
                </div>
                <p id="sendMsg" class="muted"></p>
            </div>

            <div class="panel recv">
                <h4>Nhận File</h4>
                <p class="hint">Bật chế độ chờ và chọn nơi lưu trên thiết bị.</p>
                <button class="action-recv" onclick="receive()">Chế độ chờ nhận</button>
                <button id="recvSaveBtn" onclick="confirmReceiveSave()" style="display:none; margin-top:8px;">Lưu File Này</button>
                <div class="progress"><div class="bar" id="recvBar"></div></div>
                <div class="stats">
                    <span id="recvSpeed">Tốc độ: 0 KB/s</span>
                    <span id="recvEta">Còn lại: --:--</span>
                </div>
                <p id="recvMsg" class="muted"></p>
            </div>
        </section>
    </div>

    <script src="/js/state.js"></script>
    <script src="/js/send.js"></script>
    <script src="/js/receive.js"></script>
</body>
</html>
