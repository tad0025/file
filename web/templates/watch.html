{{define "content"}}
<div class="max-w-5xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <a href="/" class="inline-flex items-center gap-2 text-xs font-medium text-slate-400 hover:text-white transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
            </svg>
            Quay lại thư viện
        </a>

        <!-- Dropdown chọn chất lượng video -->
        <div class="flex items-center gap-3">
            <label for="qualitySelect" class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Độ phân giải:</label>
            <select id="qualitySelect" class="bg-slate-900 border border-slate-700 text-white text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                {{range .Video.Qualities}}
                <option value="{{.ID}}" data-quality="{{.Quality}}">
                    {{if eq .Quality "original"}}Bản Gốc ({{formatBytes .TotalSize}})
                    {{else if eq .Quality "1080p"}}Full HD 1080p ({{formatBytes .TotalSize}})
                    {{else if eq .Quality "720p"}}HD 720p ({{formatBytes .TotalSize}})
                    {{else}}{{.Quality}} ({{formatBytes .TotalSize}}){{end}}
                </option>
                {{end}}
            </select>
        </div>
    </div>

    <!-- Video.js Player Container -->
    <div class="glass-panel p-2 sm:p-4 rounded-2xl shadow-2xl border border-slate-800">
        <div class="relative aspect-video w-full rounded-xl overflow-hidden bg-black">
            <video id="player" class="video-js vjs-big-play-centered vjs-default-skin" controls preload="metadata">
                <p class="vjs-no-js">
                    Trình duyệt không hỗ trợ HTML5 Video. Vui lòng nâng cấp trình duyệt.
                </p>
            </video>
        </div>
    </div>

    <!-- Thông tin video -->
    <div class="glass-panel p-6 rounded-2xl border border-slate-800 space-y-3">
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <h2 class="text-xl font-bold text-white tracking-tight">{{.Video.Title}}</h2>
            <span class="text-xs text-slate-400 font-mono">Đã lưu: {{.Video.CreatedAt.Format "15:04 - 02/01/2006"}}</span>
        </div>
        <div class="flex flex-wrap gap-2 text-xs text-slate-400">
            <span class="px-2.5 py-1 rounded bg-slate-900 border border-slate-800">Mã hóa: AES-256-CTR On-The-Fly</span>
            <span class="px-2.5 py-1 rounded bg-slate-900 border border-slate-800">Streaming: HTTP 206 Partial Content</span>
            <span class="px-2.5 py-1 rounded bg-slate-900 border border-slate-800">Storage: Telegram Channel</span>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    const token = {{.Token}};
    const qualitySelect = document.getElementById('qualitySelect');
    
    // Khởi tạo Video.js
    const player = videojs('player', {
        fluid: true,
        playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
        controls: true,
        autoplay: false,
        preload: 'metadata'
    });

    function getStreamURL(qualityId) {
        let url = '/api/stream/' + qualityId;
        if (token) {
            url += '?token=' + encodeURIComponent(token);
        }
        return url;
    }

    // Nạp nguồn ban đầu
    if (qualitySelect.options.length > 0) {
        const initialQualityId = qualitySelect.value;
        player.src({
            src: getStreamURL(initialQualityId),
            type: 'video/mp4'
        });
    }

    // Xử lý đổi độ phân giải giữ nguyên currentTime và tự động phát tiếp
    qualitySelect.addEventListener('change', () => {
        const newQualityId = qualitySelect.value;
        const currentTime = player.currentTime() || 0;
        const wasPlaying = !player.paused();

        console.log('[Player] Switching quality to ID:', newQualityId, 'at second:', currentTime);

        player.error(null);
        player.src({
            src: getStreamURL(newQualityId),
            type: 'video/mp4'
        });

        player.one('loadedmetadata', () => {
            if (currentTime > 0) {
                player.currentTime(currentTime);
            }
        });

        // Kích hoạt play ngay trong sự kiện user click để browser không chặn autoplay
        if (wasPlaying || true) {
            const playPromise = player.play();
            if (playPromise !== undefined) {
                playPromise.catch(e => console.log('[Player] Play deferred:', e));
            }
        }
    });
});
</script>
{{end}}
