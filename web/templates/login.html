{{define "content"}}
<div class="min-h-[70vh] flex items-center justify-center">
    <div class="glass-panel w-full max-w-md p-8 rounded-2xl shadow-2xl border border-slate-800">
        <div class="text-center mb-8">
            <div class="w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 flex items-center justify-center mx-auto mb-4 text-indigo-400">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                </svg>
            </div>
            <h2 class="text-2xl font-bold text-white tracking-tight">Xác thực Truy cập</h2>
            <p class="text-sm text-slate-400 mt-1">Nhập mật khẩu hệ thống để mở khóa video</p>
        </div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-2">Mật khẩu</label>
                <input type="password" id="password" name="password" required autofocus
                       class="w-full px-4 py-3 rounded-xl bg-slate-900/80 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all"
                       placeholder="••••••••••••">
            </div>

            <div id="errorMsg" class="hidden text-xs text-rose-400 bg-rose-950/40 border border-rose-800/60 p-3 rounded-lg"></div>

            <button type="submit" id="submitBtn"
                    class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-medium shadow-lg shadow-indigo-500/25 transition-all flex items-center justify-center gap-2">
                <span>Mở khóa Kho Video</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"/>
                </svg>
            </button>
        </form>
    </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    const pass = document.getElementById('password').value;

    btn.disabled = true;
    btn.classList.add('opacity-70');
    err.classList.add('hidden');

    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pass })
        });
        const data = await res.json();
        if (res.ok) {
            window.location.href = '/';
        } else {
            err.textContent = data.error || 'Mật khẩu không chính xác';
            err.classList.remove('hidden');
        }
    } catch (e) {
        err.textContent = 'Lỗi kết nối máy chủ';
        err.classList.remove('hidden');
    } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-70');
    }
});
</script>
{{end}}
